name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typechecks as well as bundles: `npm run build` is `tsc --noEmit && vite build`.
      - run: npm run build
      # Vitest, plain Node. A failing test exits non-zero and fails the job.
      - run: npm test
