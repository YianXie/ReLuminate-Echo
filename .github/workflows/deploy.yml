name: Deploy to GitHub Pages

# Manual for now, because `actions/configure-pages` fails the whole run if Pages has
# not been turned on for the repository yet.
#
# To make every push to main deploy automatically: turn Pages on under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then uncomment
# the `push` trigger below. Until then, run this workflow by hand from the Actions tab.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# Only what Pages needs, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The custom domain comes from public/CNAME, which Vite copies into dist.
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
