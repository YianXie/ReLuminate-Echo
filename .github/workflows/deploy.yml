name: Deploy to GitHub Pages

# Pages is enabled with Source: GitHub Actions, so every push to main publishes.
#
# This has to stay the only thing that publishes. A branch-based Pages build serves the
# repository root, which means index.html reaching for /src/main.ts — raw TypeScript,
# which GitHub serves as video/mp2t because of the file extension, and which browsers
# then refuse to execute as a module. The site looks fine and the game never starts.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what Pages needs, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The custom domain comes from public/CNAME, which Vite copies into dist.
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
